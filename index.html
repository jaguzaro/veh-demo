<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Aplica el tema antes del primer pintado (evita el destello claro). Mantener en sync con src/lib/tema.ts
      try {
        var t = localStorage.getItem('vehdemo-tema')
        if (t !== 'claro' && t !== 'oscuro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
        if (t === 'oscuro') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <title>VehDemo · Tablero del predio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
